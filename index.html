<html lang="en"><head><meta charset="utf-8">

<title>Atlas Earth × Unity Ads · Playable Creative Board</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#F1F6F9;color:#34393F;padding:40px 4%}
.wrap{max-width:900px;margin:0 auto;text-align:center}
.top{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.top img{height:64px}
.round{display:inline-block;font-size:12px;font-weight:800;letter-spacing:2px;color:#fff;background:#3E9B3F;border-radius:10px;padding:6px 14px;margin-bottom:8px}
h1{font-size:30px;font-weight:800}h1 .ae{color:#3E9B3F}
.sub{color:#4E555C;font-size:17px;margin:12px auto 30px;line-height:1.6;max-width:640px}
.stats{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:34px}
.stat{flex:1 1 200px;background:#fff;border:2px solid #E3E8EC;border-radius:16px;padding:18px 20px}
.stat b{display:block;font-size:26px;color:#3E9B3F;font-weight:800}
.stat span{font-size:13px;color:#6E7780;font-weight:600;line-height:1.4}
h2{font-size:15px;font-weight:800;letter-spacing:1.5px;color:#A3ABB3;text-transform:uppercase;margin:36px 0 14px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:28px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid #E3E8EC;border-bottom-width:5px;border-radius:18px;padding:20px 26px;display:flex;flex-direction:column-reverse;align-items:center;gap:14px;text-align:center}
@media(max-width:560px){.card{flex-direction:column;align-items:center}}
.phonewrap{flex-shrink:0;text-align:center}
.phone{width:291px;height:568px;border-radius:22px;border:3px solid #34393F;overflow:hidden;position:relative;background:#59636b;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.phone iframe{width:375px;height:740px;border:0;transform:scale(0.76);transform-origin:0 0;display:block}
.replay{margin-top:8px;background:none;border:1.5px solid #E3E8EC;border-radius:10px;color:#A3ABB3;font-size:11px;font-weight:800;letter-spacing:.6px;padding:5px 12px;cursor:pointer}
.replay:hover{color:#3E9B3F;border-color:#3E9B3F}
.meta{flex:1;min-width:0}.name{font-size:20px;font-weight:800}
.fmt{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;color:#1C7FC4;background:#DDF0FC;border-radius:8px;padding:3px 8px;margin:6px 0 10px}
.fmt.hot{color:#C06A00;background:#FFF0DA}
.hook{font-size:13.5px;color:#4E555C;line-height:1.55;margin-bottom:10px}
.thesis{font-size:12.5px;color:#7E868E;line-height:1.55}.thesis b{color:#2F8A31}
.file{font-size:10.5px;color:#A3ABB3;margin-top:10px;word-break:break-all;font-family:Menlo,monospace}
.live{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:#FF4B4B;border-radius:6px;padding:2px 7px;letter-spacing:1px;vertical-align:3px;margin-left:8px}
.tw{overflow-x:auto}table{width:100%;min-width:640px;border-collapse:collapse;background:#fff;border:2px solid #E3E8EC;border-radius:16px;overflow:hidden;font-size:13.5px}
th{background:#3E9B3F;color:#fff;font-weight:800;text-align:left;padding:11px 14px;font-size:12px;letter-spacing:.8px;text-transform:uppercase}
td{padding:11px 14px;border-top:1px solid #EEF1F3;color:#4E555C;vertical-align:top}
td:first-child{font-weight:700;color:#34393F;white-space:nowrap}
.note{background:#FFF8E1;border:2px solid #FFC800;border-radius:14px;padding:16px 18px;font-size:13px;color:#7A5800;line-height:1.6;margin-top:30px}
footer{margin-top:28px;font-size:12px;color:#A3ABB3;line-height:1.7}

<script>/* Atlas Earth playable core: MRAID lifecycle, pause-aware timers, rent ticker, map/pin/hand helpers. ES5 only. */
var AE = (function () {
  var STORE = {
    iOS: 'https://apps.apple.com/us/app/atlas-earth-fun-cashback/id1567636697',
    Android: 'https://play.google.com/store/apps/details?id=ci.atlasearth.client'
  };
  var paused = false, started = false, timers = [], tracked = [], last = 0;
  var rent = 0, rate = 0, bucks = 300, rentEl, lastTxt = '';
  function $(id) { return document.getElementById(id); }

  // ---- pause-aware scheduler (timers only advance while viewable). setInterval, not rAF, so a throttled
  // rAF in a background webview can never strand the flow mid-way. ----
  function after(ms, fn) { timers.push({ t: ms, fn: fn }); }
  function loop() {
    var ts = +new Date(), dt = last ? Math.min(ts - last, 100) : 33; last = ts;
    if (paused || !started) return;
    var due = [];
    for (var i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { due.push(timers[i].fn); timers.splice(i, 1); } }
    for (var j = due.length - 1; j >= 0; j--) due[j]();
    rent += rate * dt / 1000;
    var txt = '$' + rent.toFixed(13);
    if (txt !== lastTxt) { rentEl.innerHTML = txt; lastTxt = txt; }
  }

  // ---- rent + bucks ----
  function setRate(r) { rate = r; rentEl.className = ''; void rentEl.offsetWidth; rentEl.className = 'up'; }
  function spend(n) { bucks -= n; $('bucks').innerHTML = bucks; }
  function setBucks(n) { bucks = n; $('bucks').innerHTML = n; }

  // ---- map helpers ----
  function parcel(col, row, cls) {
    var d = document.createElement('div');
    d.className = 'parcel ' + (cls || '');
    d.style.left = (col * 10) + '%'; d.style.top = (row * 100 / 13) + '%';
    $('world').appendChild(d); return d;
  }
  function center(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function place(node, el, dy) {
    var c = center(el); node.style.left = c.x + 'px'; node.style.top = (c.y + (dy || 0)) + 'px';
  }
  function track(node, el, fn) { tracked.push({ node: node, el: el, fn: fn }); fn(); }
  function relayout() { for (var i = 0; i < tracked.length; i++) tracked[i].fn(); }

  function pin(el, img, tag) {
    var p = document.createElement('div'); p.className = 'pin';
    p.innerHTML = (tag ? '<div class=&quot;tag&quot;>' + tag + '</div>' : '') +
      '<div class=&quot;face&quot; style=&quot;background-image:url(' + img + ')&quot;></div><div class=&quot;stick&quot;></div>';
    $('fx').appendChild(p);
    track(p, el, function () { var c = center(el); p.style.left = c.x + 'px'; p.style.top = (c.y - p.offsetHeight) + 'px'; });
    return p;
  }
  var handTarget = null;
  function hand(el) {
    var h = $('hand'); handTarget = el;
    if (!el) { h.style.display = 'none'; return; }
    h.style.display = 'block'; place(h, el);
  }
  function coins(el) {
    var c = center(el), fx = $('fx');
    for (var i = 0; i < 8; i++) (function (i) {
      var k = document.createElement('div'); k.className = 'coin';
      k.style.left = c.x + 'px'; k.style.top = c.y + 'px'; fx.appendChild(k);
      var dx = (i - 3.5) * 3.2, dy = -14 - (i % 3) * 5;
      setTimeout(function () {
        var t = 'translate(' + dx + 'vmin,' + dy + 'vmin)';
        k.style.webkitTransform = t; k.style.transform = t; k.style.opacity = '0';
      }, 30);
      setTimeout(function () { if (k.parentNode) fx.removeChild(k); }, 1100);
    })(i);
  }

  // ---- captions / progress / buy / end ----
  function caption(html, cls) {
    var c = $('cap');
    if (!html) { c.className = 'ol'; return; }
    c.innerHTML = html; c.className = 'ol ' + (cls || '');
    void c.offsetWidth; c.className = 'ol on ' + (cls || '');
  }

  function once(el, fn) {

@keyframes ring{0%,45%{transform:scale(.3);opacity:0}55%{opacity:.9}100%{transform:scale(1.2);opacity:0}}
.coin{position:absolute;width:4vmin;height:4vmin;margin:-2vmin;border-radius:50%;background:#f7c53a;border:.5vmin solid #c98a12;-webkit-transition:-webkit-transform .9s ease-out,opacity .9s ease-in;transition:transform .9s ease-out,opacity .9s ease-in}

#end{position:absolute;top:0;left:0;right:0;bottom:0;z-index:50;display:none;background:#39aee8;background-image:-webkit-linear-gradient(#2d9fe0,#7fd3fa);background-image:linear-gradient(#2d9fe0,#7fd3fa);text-align:center;overflow:hidden}

#end .cloud:before,#end .cloud:after{content:&quot;&quot;;position:absolute;background:#fff;border-radius:50%}
#end .c1{left:-6vmin;bottom:18%;width:40vmin;height:10vmin}#end .c1:before{left:8vmin;top:-7vmin;width:16vmin;height:16vmin}#end .c1:after{left:20vmin;top:-4vmin;width:12vmin;height:12vmin}
#end .c2{right:-8vmin;bottom:9%;width:46vmin;height:11vmin}#end .c2:before{left:10vmin;top:-8vmin;width:18vmin;height:18vmin}#end .c2:after{left:24vmin;top:-5vmin;width:13vmin;height:13vmin}

@keyframes fade{from{opacity:0}}

@-webkit-keyframes float{to{-webkit-transform:translateY(-1.6vmin) rotate(-1.5deg)}}

<script>/* Atlas Earth playable core: MRAID lifecycle, pause-aware timers, rent ticker, map/pin/hand helpers. ES5 only. */
var AE = (function () {
  var STORE = {
    iOS: 'https://apps.apple.com/us/app/atlas-earth-fun-cashback/id1567636697',
    Android: 'https://play.google.com/store/apps/details?id=ci.atlasearth.client'
  };
  var paused = false, started = false, timers = [], tracked = [], last = 0;
  var rent = 0, rate = 0, bucks = 300, rentEl, lastTxt = '';
  function $(id) { return document.getElementById(id); }

  // ---- pause-aware scheduler (timers only advance while viewable). setInterval, not rAF, so a throttled
  // rAF in a background webview can never strand the flow mid-way. ----
  function after(ms, fn) { timers.push({ t: ms, fn: fn }); }
  function loop() {
    var ts = +new Date(), dt = last ? Math.min(ts - last, 100) : 33; last = ts;
    if (paused || !started) return;
    var due = [];
    for (var i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { due.push(timers[i].fn); timers.splice(i, 1); } }
    for (var j = due.length - 1; j >= 0; j--) due[j]();
    rent += rate * dt / 1000;
    var txt = '$' + rent.toFixed(13);
    if (txt !== lastTxt) { rentEl.innerHTML = txt; lastTxt = txt; }
  }

  // ---- rent + bucks ----
  function setRate(r) { rate = r; rentEl.className = ''; void rentEl.offsetWidth; rentEl.className = 'up'; }
  function spend(n) { bucks -= n; $('bucks').innerHTML = bucks; }
  function setBucks(n) { bucks = n; $('bucks').innerHTML = n; }

  // ---- map helpers ----
  function parcel(col, row, cls) {
    var d = document.createElement('div');
    d.className = 'parcel ' + (cls || '');
    d.style.left = (col * 10) + '%'; d.style.top = (row * 100 / 13) + '%';
    $('world').appendChild(d); return d;
  }
  function center(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function place(node, el, dy) {
    var c = center(el); node.style.left = c.x + 'px'; node.style.top = (c.y + (dy || 0)) + 'px';
  }
  function track(node, el, fn) { tracked.push({ node: node, el: el, fn: fn }); fn(); }
  function relayout() { for (var i = 0; i < tracked.length; i++) tracked[i].fn(); }

  function pin(el, img, tag) {
    var p = document.createElement('div'); p.className = 'pin';
    p.innerHTML = (tag ? '<div class=&quot;tag&quot;>' + tag + '</div>' : '') +
      '<div class=&quot;face&quot; style=&quot;background-image:url(' + img + ')&quot;></div><div class=&quot;stick&quot;></div>';
    $('fx').appendChild(p);
    track(p, el, function () { var c = center(el); p.style.left = c.x + 'px'; p.style.top = (c.y - p.offsetHeight) + 'px'; });
    return p;
  }
  var handTarget = null;
  function hand(el) {
    var h = $('hand'); handTarget = el;
    if (!el) { h.style.display = 'none'; return; }
    h.style.display = 'block'; place(h, el);
  }
  function coins(el) {
    var c = center(el), fx = $('fx');
    for (var i = 0; i < 8; i++) (function (i) {
      var k = document.createElement('div'); k.className = 'coin';
      k.style.left = c.x + 'px'; k.style.top = c.y + 'px'; fx.appendChild(k);
      var dx = (i - 3.5) * 3.2, dy = -14 - (i % 3) * 5;
      setTimeout(function () {
        var t = 'translate(' + dx + 'vmin,' + dy + 'vmin)';
        k.style.webkitTransform = t; k.style.transform = t; k.style.opacity = '0';
      }, 30);
      setTimeout(function () { if (k.parentNode) fx.removeChild(k); }, 1100);
    })(i);
  }

  // ---- captions / progress / buy / end ----
  function caption(html, cls) {
    var c = $('cap');
    if (!html) { c.className = 'ol'; return; }
    c.innerHTML = html; c.className = 'ol ' + (cls || '');
    void c.offsetWidth; c.className = 'ol on ' + (cls || '');
  }
  function prog(txt) { var p = $('prog'); p.style.display = txt ? 'inline-block' : 'none'; p.innerHTML = txt || ''; }
  function once(el, fn) {
    function h(e) { if (paused) return; el.removeEventListener('click', h); fn(e); }
    el.addEventListener('click', h);
  }
  function buy(cb) {
    var b = $('buy'); b.style.display = 'block'; hand(b);
    once(b, function () { b.style.display = 'none'; hand(null); cb(); });
  }
  function end(recap) {
    hand(null); caption(null); prog(null);
    $('recap').innerHTML = recap || ''; $('recap').style.display = recap ? 'inline-block' : 'none';
    $('end').className = 'on';
  }

  // ---- store ----
  function platform() { return /iphone|ipad|ipod/i.test(navigator.userAgent) ? 'iOS' : 'Android'; }
  function openStore() {
    var url = STORE[platform()];
    if (typeof mraid !== 'undefined') mraid.open(url); else window.open(url, '_blank');
  }

  // ---- MRAID lifecycle: nothing starts until viewable; pause when hidden ----
  var game;
  function setPaused(p) { paused = p; document.body.className = p ? 'paused' : ''; }
  function showAd() {
    if (started) { setPaused(false); return; }
    started = true; setPaused(false); game();
  }
  function onViewableChange(v) { if (v) showAd(); else setPaused(true); }
  function boot(fn) {
    game = fn; rentEl = $('rent');
    $('cta').addEventListener('click', openStore);
    window.addEventListener('resize', function () { relayout(); if (handTarget) place($('hand'), handTarget); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) setPaused(true);
      else if (started &amp;&amp; (typeof mraid === 'undefined' || mraid.isViewable())) setPaused(false);
    });
    setInterval(loop, 33);
    if (typeof mraid === 'undefined') { showAd(); return; } // local browser preview only
    function ready() {
      mraid.addEventListener('viewableChange', onViewableChange);
      if (mraid.isViewable()) showAd();
    }
    if (mraid.getState() === 'loading') mraid.addEventListener('ready', ready); else ready();
  }

  return { $: $, after: after, setRate: setRate, spend: spend, setBucks: setBucks, parcel: parcel, pin: pin,
    hand: hand, coins: coins, caption: caption, prog: prog, once: once, buy: buy, end: end, boot: boot,
    isPaused: function () { return paused; } };
})();
</script>

var RATE = 0.0000052;

function claimLot(lot) {
  lot.className = 'parcel lot owned';
  AE.pin(lot, AVATAR, 'MY PARKING LOT');
  AE.coins(lot); AE.spend(100); AE.setRate(RATE);
  AE.caption('Now he parks<br>on <span class=&quot;hl&quot;>MY land.</span>');
  AE.after(2300, pick);
}

function pick() {
  AE.caption(null);
  AE.$('dim').className = 'modal'; // pick is a modal over the dimmed map
  AE.$('fx').style.visibility = 'hidden'; // pins sit under the dim; hide them so cards never overlap them
  var panel = AE.$('pick'); panel.className = 'on';
  var cards = panel.getElementsByTagName('div');
  for (var i = 0; i < cards.length; i++) if (cards[i].className === 'card') (function (c) {
    AE.once(c, function () { if (panel.className === 'on') claimLandmark(c.getAttribute('data-n')); });
  })(cards[i]);
}

function claimLandmark(name) {
  AE.$('pick').className = ''; AE.$('dim').className = 'off'; AE.$('fx').style.visibility = '';
  var p = AE.parcel(5, 7, 'owned');
  AE.pin(p, TILES[name], name.toUpperCase());
  AE.coins(p); AE.spend(100); AE.setRate(RATE * 2);
  AE.$('boost').className = 'lit';
  AE.caption('Landmark land?<br><span class=&quot;hl&quot;>Claimed.</span>');
  AE.after(2400, function () { AE.end('Parking lot + ' + name + ': yours'); });
}

AE.boot(function () {
  // interactive from frame 1: map, HUD, glowing lot and hand are live while the story captions play over them
  var lot = AE.parcel(4, 7, 'lot target'), tapped = false;
  lot.innerHTML = '<div class=&quot;car&quot;></div><div class=&quot;car b&quot;></div>';
  AE.setBucks(200);
  AE.$('dim').className = 'off';
  AE.$('hud').className = '';
  AE.caption('This guy took<br>my <span class=&quot;hl&quot;>parking spot.</span>');
  AE.after(300, function () { if (!tapped) AE.hand(lot); });
  AE.after(1100, function () { if (!tapped) AE.caption('So I bought<br><span class=&quot;hl&quot;>the land under it.</span>'); });
  AE.after(2300, function () { if (!tapped) AE.caption('Tap the lot to <span class=&quot;hl&quot;>claim it</span>'); });
  AE.once(lot, function () {
    tapped = true;
    lot.className = 'parcel lot sel';
    AE.caption('Hit <span class=&quot;hl&quot;>BUY LAND</span>');
    AE.buy(function () { claimLot(lot); });
  });
});
</script>
