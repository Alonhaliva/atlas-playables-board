<html lang="en"><head><meta charset="utf-8">

<title>Atlas Earth × Unity Ads · Playable Creative Board</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#F1F6F9;color:#34393F;padding:40px 4%}
.wrap{max-width:900px;margin:0 auto;text-align:center}
.top{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.top img{height:64px}
.round{display:inline-block;font-size:12px;font-weight:800;letter-spacing:2px;color:#fff;background:#3E9B3F;border-radius:10px;padding:6px 14px;margin-bottom:8px}
h1{font-size:30px;font-weight:800}h1 .ae{color:#3E9B3F}
.sub{color:#4E555C;font-size:17px;margin:12px auto 30px;line-height:1.6;max-width:640px}
.stats{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:34px}
.stat{flex:1 1 200px;background:#fff;border:2px solid #E3E8EC;border-radius:16px;padding:18px 20px}
.stat b{display:block;font-size:26px;color:#3E9B3F;font-weight:800}
.stat span{font-size:13px;color:#6E7780;font-weight:600;line-height:1.4}
h2{font-size:15px;font-weight:800;letter-spacing:1.5px;color:#A3ABB3;text-transform:uppercase;margin:36px 0 14px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:28px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid #E3E8EC;border-bottom-width:5px;border-radius:18px;padding:20px 26px;display:flex;flex-direction:column-reverse;align-items:center;gap:14px;text-align:center}
@media(max-width:560px){.card{flex-direction:column;align-items:center}}
.phonewrap{flex-shrink:0;text-align:center}
.phone{width:291px;height:568px;border-radius:22px;border:3px solid #34393F;overflow:hidden;position:relative;background:#59636b;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.phone iframe{width:375px;height:740px;border:0;transform:scale(0.76);transform-origin:0 0;display:block}
.replay{margin-top:8px;background:none;border:1.5px solid #E3E8EC;border-radius:10px;color:#A3ABB3;font-size:11px;font-weight:800;letter-spacing:.6px;padding:5px 12px;cursor:pointer}
.replay:hover{color:#3E9B3F;border-color:#3E9B3F}
.meta{flex:1;min-width:0}.name{font-size:20px;font-weight:800}
.fmt{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;color:#1C7FC4;background:#DDF0FC;border-radius:8px;padding:3px 8px;margin:6px 0 10px}
.fmt.hot{color:#C06A00;background:#FFF0DA}
.hook{font-size:13.5px;color:#4E555C;line-height:1.55;margin-bottom:10px}
.thesis{font-size:12.5px;color:#7E868E;line-height:1.55}.thesis b{color:#2F8A31}
.file{font-size:10.5px;color:#A3ABB3;margin-top:10px;word-break:break-all;font-family:Menlo,monospace}
.live{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:#FF4B4B;border-radius:6px;padding:2px 7px;letter-spacing:1px;vertical-align:3px;margin-left:8px}
.tw{overflow-x:auto}table{width:100%;min-width:640px;border-collapse:collapse;background:#fff;border:2px solid #E3E8EC;border-radius:16px;overflow:hidden;font-size:13.5px}
th{background:#3E9B3F;color:#fff;font-weight:800;text-align:left;padding:11px 14px;font-size:12px;letter-spacing:.8px;text-transform:uppercase}
td{padding:11px 14px;border-top:1px solid #EEF1F3;color:#4E555C;vertical-align:top}
td:first-child{font-weight:700;color:#34393F;white-space:nowrap}
.note{background:#FFF8E1;border:2px solid #FFC800;border-radius:14px;padding:16px 18px;font-size:13px;color:#7A5800;line-height:1.6;margin-top:30px}
footer{margin-top:28px;font-size:12px;color:#A3ABB3;line-height:1.7}

<script>/* Atlas Earth playable core: MRAID lifecycle, pause-aware timers, rent ticker, map/pin/hand helpers. ES5 only. */
var AE = (function () {
  var STORE = {
    iOS: 'https://apps.apple.com/us/app/atlas-earth-fun-cashback/id1567636697',
    Android: 'https://play.google.com/store/apps/details?id=ci.atlasearth.client'
  };
  var paused = false, started = false, timers = [], tracked = [], last = 0;
  var rent = 0, rate = 0, bucks = 300, rentEl, lastTxt = '';
  function $(id) { return document.getElementById(id); }

  // ---- pause-aware scheduler (timers only advance while viewable). setInterval, not rAF, so a throttled
  // rAF in a background webview can never strand the flow mid-way. ----
  function after(ms, fn) { timers.push({ t: ms, fn: fn }); }
  function loop() {
    var ts = +new Date(), dt = last ? Math.min(ts - last, 100) : 33; last = ts;
    if (paused || !started) return;
    var due = [];
    for (var i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { due.push(timers[i].fn); timers.splice(i, 1); } }
    for (var j = due.length - 1; j >= 0; j--) due[j]();
    rent += rate * dt / 1000;
    var txt = '$' + rent.toFixed(13);
    if (txt !== lastTxt) { rentEl.innerHTML = txt; lastTxt = txt; }
  }

  // ---- rent + bucks ----
  function setRate(r) { rate = r; rentEl.className = ''; void rentEl.offsetWidth; rentEl.className = 'up'; }
  function spend(n) { bucks -= n; $('bucks').innerHTML = bucks; }
  function setBucks(n) { bucks = n; $('bucks').innerHTML = n; }

  // ---- map helpers ----
  function parcel(col, row, cls) {
    var d = document.createElement('div');
    d.className = 'parcel ' + (cls || '');
    d.style.left = (col * 10) + '%'; d.style.top = (row * 100 / 13) + '%';
    $('world').appendChild(d); return d;
  }
  function center(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function place(node, el, dy) {
    var c = center(el); node.style.left = c.x + 'px'; node.style.top = (c.y + (dy || 0)) + 'px';
  }
  function track(node, el, fn) { tracked.push({ node: node, el: el, fn: fn }); fn(); }
  function relayout() { for (var i = 0; i < tracked.length; i++) tracked[i].fn(); }

  function pin(el, img, tag) {
    var p = document.createElement('div'); p.className = 'pin';
    p.innerHTML = (tag ? '<div class=&quot;tag&quot;>' + tag + '</div>' : '') +
      '<div class=&quot;face&quot; style=&quot;background-image:url(' + img + ')&quot;></div><div class=&quot;stick&quot;></div>';
    $('fx').appendChild(p);
    track(p, el, function () { var c = center(el); p.style.left = c.x + 'px'; p.style.top = (c.y - p.offsetHeight) + 'px'; });
    return p;
  }
  var handTarget = null;
  function hand(el) {
    var h = $('hand'); handTarget = el;
    if (!el) { h.style.display = 'none'; return; }
    h.style.display = 'block'; place(h, el);
  }
  function coins(el) {
    var c = center(el), fx = $('fx');
    for (var i = 0; i < 8; i++) (function (i) {
      var k = document.createElement('div'); k.className = 'coin';
      k.style.left = c.x + 'px'; k.style.top = c.y + 'px'; fx.appendChild(k);
      var dx = (i - 3.5) * 3.2, dy = -14 - (i % 3) * 5;
      setTimeout(function () {
        var t = 'translate(' + dx + 'vmin,' + dy + 'vmin)';
        k.style.webkitTransform = t; k.style.transform = t; k.style.opacity = '0';
      }, 30);
      setTimeout(function () { if (k.parentNode) fx.removeChild(k); }, 1100);
    })(i);
  }

  // ---- captions / progress / buy / end ----
  function caption(html, cls) {
    var c = $('cap');
    if (!html) { c.className = 'ol'; return; }
    c.innerHTML = html; c.className = 'ol ' + (cls || '');
    void c.offsetWidth; c.className = 'ol on ' + (cls || '');
  }

  function once(el, fn) {

.tile .f i{position:absolute;left:50%;top:50%;width:50.4px;height:50.4px;margin:-25.2px 0 0 -25.2px;border-radius:50%;border:3.2px solid #1f7a2a;background:#8ad66a;color:#1f7a2a;font-style:normal;font-size:32.4px;line-height:43.2px}
.tile .b{background:#7cc85a;border:2.5px solid #d9f5c8;-webkit-transform:rotateY(180deg);transform:rotateY(180deg);box-shadow:0 3.6px 0 #3a7f2a}
.tile .b svg{position:absolute;left:8%;top:8%;width:84%;height:84%}
.tile.open .f{-webkit-transform:rotateY(-180deg);transform:rotateY(-180deg)}
.tile.open .b{-webkit-transform:rotateY(0);transform:rotateY(0)}
.tile.leg .b{background:#ffcf3a;background-image:-webkit-radial-gradient(50% 45%,circle,#fff2a8 0,#ffc628 70%);background-image:radial-gradient(circle at 50% 45%,#fff2a8 0,#ffc628 70%);border-color:#fff6c8;box-shadow:0 0 18px #ffd84a,0 3.6px 0 #b77a00}
.tile.hint .f{-webkit-animation:hint .8s ease-in-out infinite alternate;animation:hint .8s ease-in-out infinite alternate}
@-webkit-keyframes hint{to{box-shadow:0 3.6px 0 #1f6b26,0 0 18px #eaff9e}}@keyframes hint{to{box-shadow:0 3.6px 0 #1f6b26,0 0 18px #eaff9e}}
.hand{position:absolute;width:54px;height:54px;margin:-7.2px 0 0 -10.8px;display:none;z-index:30;pointer-events:none}
.hand svg{width:100%;height:100%;-webkit-animation:tap 1s ease-in-out infinite;animation:tap 1s ease-in-out infinite}
@-webkit-keyframes tap{0%,100%{-webkit-transform:translate(7.2px,7.2px)}50%{-webkit-transform:scale(.92)}}@keyframes tap{0%,100%{transform:translate(7.2px,7.2px)}50%{transform:scale(.92)}}

/* 4. win */
#s4 .bg{background-image:-webkit-radial-gradient(50% 45%,circle,#ffd24a 0,#d9861a 30%,#5a2a08 75%);background-image:radial-gradient(circle at 50% 45%,#ffd24a 0,#d9861a 30%,#5a2a08 75%)}
#s4 h1{margin:14% 0 0;font-size:46.8px;line-height:1}
.pair{margin:25.2px auto 0}
.pair span{display:inline-block;width:108px;height:108px;margin:0 7.2px;border-radius:10.8px;background:#ffcf3a;background-image:-webkit-radial-gradient(50% 45%,circle,#fff2a8 0,#ffc628 70%);background-image:radial-gradient(circle at 50% 45%,#fff2a8 0,#ffc628 70%);border:2.9px solid #fff6c8;box-shadow:0 0 21.6px #ffe27a;-webkit-animation:pop .5s ease-out;animation:pop .5s ease-out}
.pair svg{width:84%;height:84%;margin-top:8%}
@-webkit-keyframes pop{0%{-webkit-transform:scale(.3)}70%{-webkit-transform:scale(1.12)}}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}}
#s4 p{margin:25.2px 0 0;font-size:19.4px;line-height:1.25}
#s4 .btn{margin-top:21.6px}
.conf{position:absolute;width:8.6px;height:14.4px;top:-21.6px;-webkit-animation:fall 2.4s linear infinite;animation:fall 2.4s linear infinite}
@-webkit-keyframes fall{to{-webkit-transform:translateY(120vh) rotate(540deg)}}@keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}

/* 5. reward */
#s5 h1{margin:12% 0 0;font-size:43.2px;line-height:1}
#s5 h1 span{display:block;font-size:23.8px;margin-top:5.4px;color:#fff;text-shadow:none}
.coins{position:relative;width:216px;height:165.6px;margin:18px auto 0}
.coin{position:absolute;width:72px;height:72px;border-radius:50%;background:#34b24a;border:3.6px solid #1d7a30;box-shadow:inset 0 0 0 4.3px #58d066,0 4.3px 0 #145a22;color:#0f5a1f;font-size:43.2px;line-height:61.2px;-webkit-animation:pop .5s ease-out both;animation:pop .5s ease-out both}
#s5 p{margin:14.4px 0 0;font-size:18px;line-height:1.3}
.perks{margin-top:18px;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center}
.perks div{width:97.2px;font-size:13px;line-height:1.15}
.perks i{display:block;width:46.8px;height:46.8px;margin:0 auto 5.8px;border-radius:50%;background:#123f80;border:2.2px solid #3a78c9;padding:8.6px}
.perks svg{width:100%;height:100%}

/* 6. install */
#s6 .bg{background:#2d9fe0;background-image:-webkit-linear-gradient(#2d9fe0,#8fd8fa);background-image:linear-gradient(#2d9fe0,#8fd8fa)}
#s6 .msg{position:absolute;left:18px;right:18px;top:6%;font-size:21.6px;line-height:1.2}
.map{position:absolute;left:50%;top:32%;width:432px;height:252px;margin-left:-216px;-webkit-perspective:288px;perspective:288px}
.plane{position:absolute;top:0;left:0;right:0;bottom:0;background:#8fcf6a;background-image:-webkit-linear-gradient(rgba(255,255,255,.35) 2px,transparent 2px),-webkit-linear-gradient(left,rgba(255,255,255,.35) 2px,transparent 2px);background-image:linear-gradient(rgba(255,255,255,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.35) 2px,transparent 2px);background-size:43.2px 43.2px;-webkit-transform:rotateX(55deg);transform:rotateX(55deg);border-radius:14.4px}
.mine{position:absolute;left:172.8px;top:86.4px;width:86.4px;height:86.4px;background:#4fb03a;border:3.6px solid #ffd24a;box-shadow:0 0 21.6px #fff59a}
.pinA{position:absolute;left:50%;top:40%;margin:-72px 0 0 -28.8px;width:57.6px;height:57.6px;border-radius:50% 50% 50% 0;background:#2fb04a;border:3.6px solid #fff;-webkit-transform:rotate(-45deg);transform:rotate(-45deg);-webkit-animation:bob 1s ease-in-out infinite alternate;animation:bob 1s ease-in-out infinite alternate;z-index:3}
.pinA b{display:block;-webkit-transform:rotate(45deg);transform:rotate(45deg);font-size:32.4px;line-height:50.4px}
.earn{position:absolute;right:4px;top:46%;width:106px;background:rgba(9,31,69,.9);border:2.2px solid #3a78c9;border-radius:8.6px;padding:7.2px;font-size:11.5px;line-height:1.2;text-align:left;z-index:3}
.earn b{display:block;font-size:23px;color:#7dff6a}
.earn small{font-size:9.4px;color:#cfe3ff}
#s6 .foot{position:absolute;left:0;right:0;bottom:6%}
#s6 .logo{width:172.8px}
#s6 .btn{display:block;width:266.4px;margin:10.8px auto 0;padding:0}
#disc{margin-top:10.8px;font:700 7.2px/1.3 Arial,sans-serif;color:#0a2a55;padding:0 14.4px}

</style>
</head>

var paused = false, started = false, timers = [], last = 0;

function loop() {
  var cw = window.innerWidth || document.documentElement.clientWidth, ch = window.innerHeight || document.documentElement.clientHeight;
  if (cw !== lastW || ch !== lastH) { fit(); if (handEl) hand(handEl); placePin(); }
  var ts = +new Date(), dt = last ? Math.min(ts - last, 100) : 33; last = ts;
  if (paused || !started) return;
  var due = [];
  for (var i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { due.push(timers[i].fn); timers.splice(i, 1); } }
  for (var j = due.length - 1; j >= 0; j--) due[j]();
}
function once(el, fn) { function h(e) { if (paused) return; el.removeEventListener('click', h); fn(e); } el.addEventListener('click', h); }

var handEl = null;
function hand(el) {
  var h = $('hand'); handEl = el;
  if (!el) { h.style.display = 'none'; return; }
  var r = el.getBoundingClientRect();
  h.style.left = (r.left + r.width / 2) + 'px'; h.style.top = (r.top + r.height / 2) + 'px'; h.style.display = 'block';
}
var cur = null;
function show(id) { if (cur) $(cur).className = 'scene'; $(id).className = 'scene on'; cur = id; fit(); }

/* ---- flow ---- */
var step = 0;
function go(n) { if (n <= step) return; step = n; STEPS[n](); }
var STEPS = {
  1: function () {
    show('s1');
    after(400, function () { if (step === 1) hand($('play')); });
    once($('play'), function () { go(2); });
    after(2200, function () { go(2); }); // never sit on the hook
  },
  2: function () {
    hand(null); show('s2');
    var g = $('grid'), flips = 0, found = 0, commons = COMMONS.slice(), tiles = [];
    g.innerHTML = '';
    for (var i = 0; i < 9; i++) (function (i) {
      var t = document.createElement('div'); t.className = 'tile';
      t.style.left = (i % 3) * 34.5 + '%'; t.style.top = Math.floor(i / 3) * 34.5 + '%';
      t.innerHTML = '<div class=&quot;f&quot;><i>A</i></div><div class=&quot;b&quot;></div>';
      g.appendChild(t); tiles.push(t);
      once(t, function () { flip(t); });
    })(i);
    tiles[5].className = 'tile hint';
    after(350, function () { if (flips === 0) hand(tiles[5]); });
    function flip(t) {
      flips++; hand(null);
      for (var k = 0; k < tiles.length; k++) if (tiles[k].className === 'tile hint') tiles[k].className = 'tile';
      // legendary always lands on the 2nd and 4th flip, so every player wins in 4 taps
      var leg = flips === 2 || flips === 4, kind = leg ? 'gold' : commons.shift();
      t.getElementsByClassName('b')[0].innerHTML = svg(kind);
      t.className = 'tile open' + (leg ? ' leg' : '');
      if (flips === 1) $('head').innerHTML = 'Match two <span class=&quot;gold&quot;>Legendary</span><br>parcels to win.';
      if (leg) found++;
      if (found === 1 &amp;&amp; leg) $('head').innerHTML = '1 <span class=&quot;gold&quot;>Legendary</span> found!<small>Find one more</small>';
      if (found === 2) {
        after(500, function () { for (var k = 0; k < tiles.length; k++) if (tiles[k].className.indexOf('open') < 0) { tiles[k].getElementsByClassName('b')[0].innerHTML = svg(commons.shift() || 'tree'); tiles[k].className = 'tile open'; } });
        after(1500, function () { go(4); });
        return;
      }
      var closed = []; for (var k = 0; k < tiles.length; k++) if (tiles[k].className.indexOf('open') < 0) closed.push(tiles[k]);
      after(700, function () { if (step === 2 &amp;&amp; found < 2 &amp;&amp; closed[0] &amp;&amp; closed[0].className.indexOf('open') < 0) { closed[0].className = 'tile hint'; hand(closed[0]); } });
    }
  },
  4: function () {
    hand(null); show('s4');
    $('p1').innerHTML = svg('gold'); $('p2').innerHTML = svg('gold');
    var c = $('conf'), cols = ['#ffd93b', '#7dff6a', '#5fd0ff', '#ff6b8a', '#fff'];
    for (var i = 0; i < 18; i++) { var d = document.createElement('div'); d.className = 'conf'; d.style.left = (i * 5.6) + '%'; d.style.background = cols[i % 5]; d.style.webkitAnimationDelay = d.style.animationDelay = (i % 6) * 0.35 + 's'; c.appendChild(d); }
    after(700, function () { if (step === 4) hand($('awesome')); });
    once($('awesome'), function () { go(5); });
    after(2600, function () { go(5); });
  },
  5: function () {
    hand(null); show('s5');
    var pos = [[20, 12], [0, 2], [40, 4], [10, -8], [30, -14]], h = '';
    for (var i = 0; i < pos.length; i++) h += '<div class=&quot;coin ol&quot; style=&quot;left:' + pos[i][0] * 3.6 + 'px;top:' + (pos[i][1] + 17) * 3.6 + 'px;-webkit-animation-delay:' + i * 0.12 + 's;animation-delay:' + i * 0.12 + 's&quot;>A</div>';
    $('coins').innerHTML = h;
    var P = [
      ['<path d=&quot;M34 4L14 34h14l-4 26 22-32H32z&quot; fill=&quot;#ffd93b&quot;/>', 'CLAIM<br>LAND'],
      ['<rect x=&quot;8&quot; y=&quot;36&quot; width=&quot;12&quot; height=&quot;20&quot; fill=&quot;#5ee06a&quot;/><rect x=&quot;26&quot; y=&quot;24&quot; width=&quot;12&quot; height=&quot;32&quot; fill=&quot;#5ee06a&quot;/><rect x=&quot;44&quot; y=&quot;10&quot; width=&quot;12&quot; height=&quot;46&quot; fill=&quot;#5ee06a&quot;/>', 'EARN<br>RENT'],
      ['<circle cx=&quot;32&quot; cy=&quot;18&quot; r=&quot;9&quot; fill=&quot;#fff&quot;/><path d=&quot;M16 50c0-10 7-16 16-16s16 6 16 16z&quot; fill=&quot;#fff&quot;/><circle cx=&quot;12&quot; cy=&quot;24&quot; r=&quot;6&quot; fill=&quot;#cfe3ff&quot;/><circle cx=&quot;52&quot; cy=&quot;24&quot; r=&quot;6&quot; fill=&quot;#cfe3ff&quot;/>', 'BUILD YOUR<br>WORLD']
    ];
    h = ''; for (var j = 0; j < P.length; j++) h += '<div><i><svg viewBox=&quot;0 0 64 64&quot;>' + P[j][0] + '</svg></i>' + P[j][1] + '</div>';
    $('perks').innerHTML = h;
    $('s5').addEventListener('click', function () { go(6); });
    after(2800, function () { go(6); });
  },
  6: function () { hand(null); show('s6'); placePin(); }
};

/* ---- store + MRAID lifecycle: nothing starts until viewable; pause when hidden ---- */
function openStore() {
  var url = STORE[/iphone|ipad|ipod/i.test(navigator.userAgent) ? 'iOS' : 'Android'];
  if (typeof mraid !== 'undefined') mraid.open(url); else window.open(url, '_blank');
}
function setPaused(p) { paused = p; document.body.className = p ? 'paused' : ''; }
function showAd() { if (started) { setPaused(false); return; } started = true; setPaused(false); go(1); }
function onViewableChange(v) { if (v) showAd(); else setPaused(true); }
$('cta').addEventListener('click', openStore);
var K = 1, lastW = 0, lastH = 0;
// a webview/iframe can report 0x0 before layout; never apply a zero scale, and re-measure whenever the size changes
function fit() {
  var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight;
  if (!w || !h) return;
  lastW = w; lastH = h;
  K = Math.min(w / 360, h / 640);
  var st = document.getElementsByClassName('stage'), t = 'scale(' + K + ')';
  for (var i = 0; i < st.length; i++) { st[i].style.webkitTransform = t; st[i].style.transform = t; }
}
function placePin() {
  if (cur !== 's6') return;
  var r = document.querySelector('.mine').getBoundingClientRect(), sr = document.querySelector('#s6 .stage').getBoundingClientRect(), p = document.querySelector('.pinA');
  p.style.left = ((r.left + r.width / 2 - sr.left) / K) + 'px'; p.style.top = ((r.top + r.height / 2 - sr.top) / K) + 'px';
}
window.addEventListener('resize', function () { fit(); if (handEl) hand(handEl); placePin(); });
fit();
document.addEventListener('visibilitychange', function () {
  if (document.hidden) setPaused(true);
  else if (started &amp;&amp; (typeof mraid === 'undefined' || mraid.isViewable())) setPaused(false);
});
setInterval(loop, 33);
if (typeof mraid === 'undefined') showAd(); // local browser preview only
else {
  var ready = function () { mraid.addEventListener('viewableChange', onViewableChange); if (mraid.isViewable()) showAd(); };
  if (mraid.getState() === 'loading') mraid.addEventListener('ready', ready); else ready();
}
</script>
